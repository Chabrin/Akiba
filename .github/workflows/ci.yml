name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Akiba itself does not use Docker - it runs as a service against an installed
    # PostgreSQL, and docs/deployment.md says why. The integration tests still need a real
    # PostgreSQL, and the runner provides one here at no cost to anybody's machine.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: akiba_tests
          POSTGRES_USER: akiba
          POSTGRES_PASSWORD: akiba-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Akiba.sln

      # Directory.Build.props sets TreatWarningsAsErrors, so a warning fails here.
      - name: Build
        run: dotnet build Akiba.sln --configuration Release --no-restore

      - name: Test
        env:
          AKIBA_TEST_POSTGRES: Host=localhost;Port=5432;Database=akiba_tests;Username=akiba;Password=akiba-ci-only
        run: >-
          dotnet test Akiba.sln
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --collect:"XPlat Code Coverage"
          --results-directory ./artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./artifacts/test-results
          retention-days: 14

  format:
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Verify formatting matches .editorconfig
        run: dotnet format Akiba.sln --verify-no-changes --severity warn

  architecture:
    name: Architecture rules
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Run as its own job so a dependency-rule violation shows up as such in the checks list,
    # rather than buried in the full test run. Needs no database.
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Enforce layer dependency rules
        run: >-
          dotnet test tests/Akiba.ArchitectureTests/Akiba.ArchitectureTests.csproj
          --configuration Release
          --logger "console;verbosity=normal"

  publish:
    name: Publish check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Akiba is deployed by copying publish output onto the machine, so a publish that fails
    # is a deployment that fails. Cheaper to find out here.
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish
        run: dotnet publish src/Akiba.Web --configuration Release --output ./publish

      - name: Confirm the entry point is there
        run: test -f ./publish/Akiba.Web.dll
