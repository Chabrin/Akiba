name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Akiba.sln

      # Directory.Build.props sets TreatWarningsAsErrors, so a warning fails here.
      - name: Build
        run: dotnet build Akiba.sln --configuration Release --no-restore

      # Integration tests use Testcontainers and need a working Docker daemon.
      # ubuntu-latest runners provide one; this fails loudly if that ever changes.
      - name: Verify Docker is available for Testcontainers
        run: docker info > /dev/null

      - name: Test
        run: >-
          dotnet test Akiba.sln
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --collect:"XPlat Code Coverage"
          --results-directory ./artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./artifacts/test-results
          retention-days: 14

  format:
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Verify formatting matches .editorconfig
        run: dotnet format Akiba.sln --verify-no-changes --severity warn

  architecture:
    name: Architecture rules
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Run the architecture tests as their own job so a dependency-rule violation is
    # visible as such in the checks list, rather than buried in the full test run.
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Enforce layer dependency rules
        run: >-
          dotnet test tests/Akiba.ArchitectureTests/Akiba.ArchitectureTests.csproj
          --configuration Release
          --logger "console;verbosity=normal"
